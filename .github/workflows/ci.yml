# Build and test on every pull request and push to main, on a stock runner, from nuget.org alone: a contributor
# outside the organisation builds this repository exactly the same way.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # The screens (Alcifra.Messenger.Views) are .NET MAUI for Android: the workload, and the SDK and JDK the runner
      # image already carries.
      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      # Nothing to build until the first project arrives; the step says so rather than passing silently.
      - name: Build and test
        run: |
          set -euo pipefail
          if [ ! -f AlcifraMessenger.slnx ]; then
            echo "::notice::No solution yet: the first slice adds AlcifraMessenger.slnx."
            exit 0
          fi
          dotnet build AlcifraMessenger.slnx -warnaserror
          dotnet test AlcifraMessenger.slnx --no-build

  # The screens' iOS build (MemoryPlayer's system player reading from memory) needs a Mac with Xcode; the Linux job above
  # builds the rest. The same image packs the package (publish.yml), so what passes here is what ships.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # Both: restoring the project evaluates every target, Android's included (and publish.yml packs all of them here).
      - name: Install the MAUI workloads
        run: dotnet workload install maui-android maui-ios
      - name: Build the screens for iOS
        run: dotnet build src/Alcifra.Messenger.Views -f net10.0-ios26.0 -warnaserror
