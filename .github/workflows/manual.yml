# The committed manual PDF must be exactly what its source builds (manual/build.sh). It ships inside the module
# package and the core files a new version of it whenever its bytes change (core ADR 0891), so a stale or
# non-reproducible PDF is a product defect, not a docs nit. It had drifted behind its source once already. The same job
# builds the SITE BUNDLE (core #2165) the website shows: a `site-bundle` artifact of every main build.
name: Manual
on:
  pull_request:
    paths: ["manual/**", ".github/workflows/manual.yml"]
  push:
    branches: [main]
    paths: ["manual/**", ".github/workflows/manual.yml"]

permissions:
  contents: read

jobs:
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # build.sh pins the PDF timestamp to the manual source's last commit
      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4.3.1
        with:
          typst-version: "0.15.1" # the version the committed PDF was built with; bump both together
      - name: Rebuild and compare
        run: |
          manual/build.sh "$RUNNER_TEMP/rebuilt.pdf"
          if ! cmp -s "$RUNNER_TEMP/rebuilt.pdf" manual/Alcifra-Messenger-Module-Manual.pdf; then
            echo "::error::manual/Alcifra-Messenger-Module-Manual.pdf is not what manual.typ builds. Run manual/build.sh and commit the result."
            exit 1
          fi
          echo "The committed manual PDF is exactly what its source builds."
      # The site bundle (core #2165, core ADR 1010): the feature summaries, figures and PDF the website shows on the
      # module's product page, read out of the manual's markers. Built and checked on every run, so a change that
      # breaks the contract fails its PR; main's bundle is the website preview's input, and the release attaches it.
      - name: Build the site bundle
        run: manual/site-bundle.sh "$RUNNER_TEMP/site"
      - name: Publish the site bundle for the website's preview
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-bundle
          path: ${{ runner.temp }}/site/site-bundle.zip
          retention-days: 90
