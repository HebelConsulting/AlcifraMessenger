# Publishes this repository's packages to nuget.org when a version tag is pushed (v*), by TRUSTED PUBLISHING: nuget.org's
# policy for this repository names this workflow file and the environment `nuget`, and the login step trades the run's
# OIDC token for a key valid for this run only. No key is stored anywhere.
#
# Every packable project is packed; --skip-duplicate makes a version that is already there a no-op, so a tag publishes
# exactly the packages whose version was bumped. A version on nuget.org is permanent (it can be unlisted, never deleted),
# so only a tagged commit publishes, after CI.
#
# On a Mac: the screens carry an iOS build, which only Xcode makes, and their project refuses to pack without it.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # the release that carries the site bundle (core #2165)
  id-token: write

jobs:
  publish:
    runs-on: macos-26
    environment: nuget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Install the MAUI workloads
        run: dotnet workload install maui-android maui-ios
      - name: Test
        run: dotnet test AlcifraMessenger.slnx -c Release
      - name: Pack
        run: dotnet pack AlcifraMessenger.slnx -c Release --no-build -o artifacts
      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: monacense
      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
      # The module's release carries its SITE BUNDLE (core #2165, core ADR 1010): the manual, the feature summaries and
      # the figures the website shows for this version. Built from this tag's manual, stamped with the version; the
      # release is made here if the tag has none yet, and gains the bundle if it has.
      - uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4.3.1
        with:
          typst-version: "0.15.1"
      - name: Attach the site bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          manual/site-bundle.sh "$RUNNER_TEMP/site" "$version"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/site/site-bundle.zip" --clobber
